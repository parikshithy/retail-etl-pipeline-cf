AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Lambda function for the retail ETL pipeline - CloudFormation parallel
  stack (_cf suffix). Starts the Glue workflow when a CSV lands in raw/.
  Code is packaged from lambda/lambda_function.py in the repo and
  uploaded to S3 by the deploy workflow before this stack runs - see
  Parameters below.

  S3 -> Lambda wiring uses EventBridge instead of a direct S3 bucket
  notification. This avoids the classic circular dependency (the bucket
  needing the Lambda's ARN, the Lambda needing the bucket's ARN): the
  bucket only needs a static "EventBridgeEnabled: true" flag (set in
  s3-stack.yaml, with no reference to Lambda at all), and the
  EventBridge Rule below lives in this same stack, so it can reference
  the Lambda function directly (no cross-stack reference needed) while
  importing only the bucket *name* (a plain string, already exported by
  the S3 stack, which deploys before this one) to build its event
  pattern. Nothing here is wired via a post-deploy CLI call.

Parameters:
  CodeS3Bucket:
    Type: String
    Description: >
      S3 bucket containing the zipped Lambda deployment package
      (uploaded by the deploy workflow from lambda/lambda_function.py).

  CodeS3Key:
    Type: String
    Description: S3 key of the zipped Lambda deployment package.
    Default: lambda-packages/lambda_function.zip

Resources:
  TriggerLambdaCf:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: retail-etl-trigger-lambda-cf
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Role: !ImportValue retail-etl-cf-lambda-role-arn
      Timeout: 30
      Environment:
        Variables:
          GLUE_WORKFLOW_NAME: retail-etl-workflow-cf
          OUTPUT_BUCKET_NAME: !ImportValue retail-etl-cf-output-bucket-name
      Tags:
        - Key: Project
          Value: retail-etl-pipeline
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key

  # EventBridge rule: matches "Object Created" events from the input
  # bucket, filtered to keys under raw/. Suffix (.csv) and empty-file
  # checks are left to the Lambda itself (it already validates both),
  # since EventBridge's per-field matching applies OR semantics across
  # multiple conditions on the same field, not AND - so enforcing both
  # prefix and suffix in a single rule pattern isn't straightforward,
  # and the Lambda-side check already covers it cleanly.
  S3EventRuleCf:
    Type: AWS::Events::Rule
    Properties:
      Name: retail-etl-s3-object-created-cf
      Description: >
        Fires when a new object lands under raw/ in the input bucket,
        and invokes the trigger Lambda.
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - Object Created
        detail:
          bucket:
            name:
              - !ImportValue retail-etl-cf-input-bucket-name
          object:
            key:
              - prefix: raw/
      State: ENABLED
      Targets:
        - Arn: !GetAtt TriggerLambdaCf.Arn
          Id: retail-etl-trigger-lambda-target-cf

  LambdaInvokePermissionCf:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TriggerLambdaCf
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt S3EventRuleCf.Arn

Outputs:
  LambdaFunctionArn:
    Description: ARN of the trigger Lambda function
    Value: !GetAtt TriggerLambdaCf.Arn
    Export:
      Name: retail-etl-cf-lambda-function-arn

  LambdaFunctionName:
    Description: Name of the trigger Lambda function
    Value: !Ref TriggerLambdaCf
    Export:
      Name: retail-etl-cf-lambda-function-name
