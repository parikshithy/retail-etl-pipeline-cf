name: Deploy or Destroy CF Pipeline

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose deploy or destroy"
        required: true
        type: choice
        options:
          - deploy
          - destroy
      confirm_destroy:
        description: "To destroy, type the exact text: destroy-everything"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2

jobs:
  deploy:
    if: github.event.inputs.action == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ---------- IAM STACK ----------
      - name: Preview change set - IAM stack
        run: |
          aws cloudformation deploy \
            --stack-name retail-etl-iam-stack-cf \
            --template-file cloudformation/iam-stack.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-execute-changeset \
            --region ${{ env.AWS_REGION }}

      - name: Print change set contents
        run: |
          CHANGESET_NAME=$(aws cloudformation list-change-sets \
            --stack-name retail-etl-iam-stack-cf \
            --region ${{ env.AWS_REGION }} \
            --query "Summaries[0].ChangeSetName" --output text)

          if [ "$CHANGESET_NAME" != "None" ] && [ -n "$CHANGESET_NAME" ]; then
            echo "----- Pending IAM stack changes -----"
            aws cloudformation describe-change-set \
              --stack-name retail-etl-iam-stack-cf \
              --change-set-name "$CHANGESET_NAME" \
              --region ${{ env.AWS_REGION }} \
              --query "Changes[].ResourceChange.{Action:Action,Resource:LogicalResourceId,Type:ResourceType}" \
              --output table
          else
            echo "No pending changes to the IAM stack."
          fi
        # This step exists precisely so the change set preview above is
        # actually looked at by someone before it's applied, instead of
        # sitting unread between a preview call and an immediate execute.

      - name: Execute change set - IAM stack
        run: |
          aws cloudformation deploy \
            --stack-name retail-etl-iam-stack-cf \
            --template-file cloudformation/iam-stack.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --region ${{ env.AWS_REGION }}

      # ---------- S3 STACK ----------
      - name: Deploy S3 stack
        run: |
          aws cloudformation deploy \
            --stack-name retail-etl-s3-stack-cf \
            --template-file cloudformation/s3-stack.yaml \
            --region ${{ env.AWS_REGION }}

      # ---------- RESOLVE ACTUAL BUCKET NAMES (account-suffixed, never hardcoded) ----------
      - name: Resolve bucket names from CloudFormation exports
        run: |
          INPUT_BUCKET=$(aws cloudformation list-exports \
            --region ${{ env.AWS_REGION }} \
            --query "Exports[?Name=='retail-etl-cf-input-bucket-name'].Value" \
            --output text)

          OUTPUT_BUCKET=$(aws cloudformation list-exports \
            --region ${{ env.AWS_REGION }} \
            --query "Exports[?Name=='retail-etl-cf-output-bucket-name'].Value" \
            --output text)

          echo "INPUT_BUCKET=$INPUT_BUCKET" >> "$GITHUB_ENV"
          echo "OUTPUT_BUCKET=$OUTPUT_BUCKET" >> "$GITHUB_ENV"

          echo "Resolved input bucket: $INPUT_BUCKET"
          echo "Resolved output bucket: $OUTPUT_BUCKET"

      # ---------- UPLOAD GLUE SCRIPT FROM REPO ----------
      - name: Upload Glue ETL script (glue/glue_job.py) to input bucket
        run: |
          aws s3 cp glue/glue_job.py \
            "s3://$INPUT_BUCKET/scripts/glue_job.py" \
            --region ${{ env.AWS_REGION }}

      # ---------- PACKAGE + UPLOAD LAMBDA CODE FROM REPO ----------
      - name: Zip lambda/lambda_function.py
        run: |
          cd lambda
          zip lambda_function.zip lambda_function.py
          cd ..

      - name: Upload Lambda deployment package to input bucket
        run: |
          aws s3 cp lambda/lambda_function.zip \
            "s3://$INPUT_BUCKET/lambda-packages/lambda_function.zip" \
            --region ${{ env.AWS_REGION }}

      # ---------- LAMBDA STACK ----------
      - name: Deploy Lambda stack
        run: |
          aws cloudformation deploy \
            --stack-name retail-etl-lambda-stack-cf \
            --template-file cloudformation/lambda-stack.yaml \
            --parameter-overrides \
              CodeS3Bucket=$INPUT_BUCKET \
              CodeS3Key=lambda-packages/lambda_function.zip \
            --region ${{ env.AWS_REGION }}

      # ---------- GLUE STACK ----------
      - name: Deploy Glue stack
        run: |
          aws cloudformation deploy \
            --stack-name retail-etl-glue-stack-cf \
            --template-file cloudformation/glue-stack.yaml \
            --region ${{ env.AWS_REGION }}

      # NOTE: S3 -> Lambda wiring is no longer a CLI step. The S3 stack
      # enables EventBridge on the bucket (a static flag) and the Lambda
      # stack's AWS::Events::Rule + AWS::Lambda::Permission handle the
      # actual routing - both are real CloudFormation resources, so a
      # `describe-stacks` on either stack now shows the complete wiring,
      # and destroying the Lambda stack automatically removes the rule.

      - name: Deploy summary
        run: echo "All _cf stacks deployed and wired successfully."

  destroy:
    if: github.event.inputs.action == 'destroy'
    runs-on: ubuntu-latest
    steps:
      - name: Verify destroy confirmation phrase
        run: |
          if [ "${{ github.event.inputs.confirm_destroy }}" != "destroy-everything" ]; then
            echo "::error::Destroy was not confirmed. Re-run this workflow with 'confirm_destroy' set exactly to: destroy-everything"
            exit 1
          fi
          echo "Destroy confirmed - proceeding to tear down all _cf stacks."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ---------- RESOLVE BUCKET NAMES BEFORE ANYTHING IS DELETED ----------
      - name: Resolve bucket names from CloudFormation exports
        id: resolve
        run: |
          INPUT_BUCKET=$(aws cloudformation list-exports \
            --region ${{ env.AWS_REGION }} \
            --query "Exports[?Name=='retail-etl-cf-input-bucket-name'].Value" \
            --output text)

          OUTPUT_BUCKET=$(aws cloudformation list-exports \
            --region ${{ env.AWS_REGION }} \
            --query "Exports[?Name=='retail-etl-cf-output-bucket-name'].Value" \
            --output text)

          echo "INPUT_BUCKET=$INPUT_BUCKET" >> "$GITHUB_ENV"
          echo "OUTPUT_BUCKET=$OUTPUT_BUCKET" >> "$GITHUB_ENV"

          if [ -z "$INPUT_BUCKET" ] || [ "$INPUT_BUCKET" == "None" ]; then
            echo "::warning::Could not resolve bucket names from exports - S3 stack may already be gone. Skipping bucket cleanup."
            echo "buckets_found=false" >> "$GITHUB_OUTPUT"
          else
            echo "buckets_found=true" >> "$GITHUB_OUTPUT"
          fi

      # No manual "remove notification" step needed here: the S3 bucket's
      # EventBridge flag is just a static setting (removed when the S3
      # stack itself deletes), and the actual rule + Lambda permission
      # live in the Lambda stack, deleted a few steps below.

      - name: Empty input bucket
        if: steps.resolve.outputs.buckets_found == 'true'
        run: |
          aws s3 rm "s3://$INPUT_BUCKET" --recursive

      - name: Empty output bucket
        if: steps.resolve.outputs.buckets_found == 'true'
        run: |
          aws s3 rm "s3://$OUTPUT_BUCKET" --recursive

      - name: Delete Glue stack
        run: |
          aws cloudformation delete-stack --stack-name retail-etl-glue-stack-cf --region ${{ env.AWS_REGION }}
          aws cloudformation wait stack-delete-complete --stack-name retail-etl-glue-stack-cf --region ${{ env.AWS_REGION }}

      - name: Delete Lambda stack
        run: |
          aws cloudformation delete-stack --stack-name retail-etl-lambda-stack-cf --region ${{ env.AWS_REGION }}
          aws cloudformation wait stack-delete-complete --stack-name retail-etl-lambda-stack-cf --region ${{ env.AWS_REGION }}

      - name: Delete S3 stack
        run: |
          aws cloudformation delete-stack --stack-name retail-etl-s3-stack-cf --region ${{ env.AWS_REGION }}
          aws cloudformation wait stack-delete-complete --stack-name retail-etl-s3-stack-cf --region ${{ env.AWS_REGION }}

      - name: Delete IAM stack
        run: |
          aws cloudformation delete-stack --stack-name retail-etl-iam-stack-cf --region ${{ env.AWS_REGION }}
          aws cloudformation wait stack-delete-complete --stack-name retail-etl-iam-stack-cf --region ${{ env.AWS_REGION }}

      - name: Destroy summary
        run: echo "All _cf stacks destroyed successfully."
